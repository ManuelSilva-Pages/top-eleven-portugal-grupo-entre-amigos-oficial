<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Top Eleven Portugal – Ranking Oficial</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f4f4f4;
    }

    header {
      background-color: #1f2933;
      color: white;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    header img { height: 80px; }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 5px 0 0;
      font-size: 14px;
      opacity: 0.9;
    }

    #data-atualizacao {
      font-size: 13px;
      opacity: 0.85;
      margin-top: 4px;
    }

    nav {
      background-color: #ffffff;
      padding: 10px;
      display: flex;
      gap: 10px;
      border-bottom: 1px solid #ddd;
    }

    nav button {
      padding: 10px 16px;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 14px;
      border-radius: 6px;
      transition: all 0.25s ease;
    }

    .btn-suprema { background-color: #1e3a8a; }
    .btn-diamante { background-color: #ec4899; }

    .btn-top100 {
  background: linear-gradient(135deg, #ae8625, #f7ef8a, #d2ac47, #edc967);
  color: #78350f;
      font-weight: bold;
    }

    nav button.active {
      box-shadow: 0 0 0 3px rgba(59,130,246,0.4);
      transform: scale(1.05);
    }

    section {
      display: none;
      padding: 20px;
      animation: fade 0.3s ease-in-out;
    }

    section.active { display: block; }

    @keyframes fade {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .total-assoc {
      margin: 10px 0;
      font-weight: bold;
      color: #374151;
    }

    .search-box { margin: 10px 0; }

    .search-box input {
      width: 100%;
      max-width: 320px;
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 8px;
      border: 1px solid #ccc;
      text-align: center;
    }

    th { background-color: #e5e7eb; }

    .top-1 { background-color: #ffd700; font-weight: bold; font-size: 15px; }
    .top-2 { background-color: #c0c0c0; font-weight: bold; font-size: 15px; }
    .top-3 { background-color: #cd7f32; font-weight: bold; font-size: 15px; }

    .oficial-gea td {
      border-left: 6px solid #16a34a;
      background-color: #ecfdf5;
    }

    /* MENSAGEM PREMIUM DENTRO DA TABELA */
    .linha-sem-resultados td {
      background-color: #fff7ed;
      color: #92400e;
      font-weight: bold;
      text-align: center;
      padding: 14px;
      border-left: 6px solid #f59e0b;
    }

    #btnTopo {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #1f2933;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 50px;
      cursor: pointer;
      display: none;
    }
  </style>
</head>

<body>

<header>
  <img src="logo.png" alt="Top Eleven Portugal">
  <div>
    <h1>Top Eleven Portugal</h1>
    <p>Ranking oficial do grupo Top Eleven Portugal - Grupo Entre Amigos [OFICIAL]</p>
    <div id="data-atualizacao">Última atualização: a carregar...</div>
  </div>
</header>

<nav>
  <button class="btn-suprema active" onclick="mostrar('suprema', this)">Suprema</button>
  <button class="btn-diamante" onclick="mostrar('diamante', this)">Diamante</button>
  <button class="btn-top100" onclick="mostrar('top100', this)">Top 100</button>
</nav>

<section id="suprema" class="active">
  <h2>Divisão Suprema</h2>
  <div class="search-box">
    <input type="text" placeholder="🔍 Pesquisar associação ou tag..." oninput="filtrar('suprema')">
  </div>
  <div class="total-assoc" id="suprema-total"></div>
  <div id="suprema-tabela"></div>
</section>

<section id="diamante">
  <h2>Divisão Diamante</h2>
  <div class="search-box">
    <input type="text" placeholder="🔍 Pesquisar associação ou tag..." oninput="filtrar('diamante')">
  </div>
  <div class="total-assoc" id="diamante-total"></div>
  <div id="diamante-tabela"></div>
</section>

<section id="top100">
  <h2>Top 100 Associações</h2>
  <div class="search-box">
    <input type="text" placeholder="🔍 Pesquisar associação ou tag..." oninput="filtrar('top100')">
  </div>
  <div class="total-assoc" id="top100-total"></div>
  <div id="top100-tabela"></div>
</section>

<button id="btnTopo" onclick="window.scrollTo({top:0, behavior:'smooth'})">⬆ Topo</button>

<script>
const SHEET_ID = "1V0pgh17X-6oQnZyZ1Wo8YiQBCadTXw5DK8YIGjtxzBI";
let dadosGlobais = {};

function mostrar(id, btn) {
  document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");

  window.scrollTo({ top: 0, behavior: "smooth" });
}

function carregarTabela(aba, container, total) {
  fetch(`https://opensheet.elk.sh/${SHEET_ID}/${aba}`)
    .then(r => r.json())
    .then(dados => {
      dadosGlobais[container] = dados;
      renderTabela(dados, container, total);
    });
}

function renderTabela(dados, container, total) {
  document.getElementById(total).innerText =
    `Total de associações nesta divisão: ${dados.length}`;

  let html = `
    <table>
      <tr>
        <th>Posição</th>
        <th>Associação</th>
        <th>Tag</th>
        <th>Pontos</th>
      </tr>
  `;

  if (dados.length === 0) {
    html += `
      <tr class="linha-sem-resultados">
        <td colspan="4">🔍 Nenhuma associação encontrada</td>
      </tr>
    `;
  } else {
    dados.forEach(l => {
      let classe = "";
      if (l.Posicao == 1) classe = "top-1";
      else if (l.Posicao == 2) classe = "top-2";
      else if (l.Posicao == 3) classe = "top-3";
      if (l.Associacao?.toUpperCase().startsWith("GEA")) classe += " oficial-gea";

      html += `
        <tr class="${classe}">
          <td>${l.Posicao}</td>
          <td>${l.Associacao}</td>
          <td>${l.Tag || ""}</td>
          <td>${l.Pontos}</td>
        </tr>
      `;
    });
  }

  html += "</table>";
  document.getElementById(container).innerHTML = html;
}

function filtrar(sec) {
  const input = document.querySelector(`#${sec} input`).value.trim().toUpperCase().replace("#","");
  const dados = dadosGlobais[`${sec}-tabela`] || [];

  const filtrados = dados.filter(l =>
    l.Associacao?.toUpperCase().includes(input) ||
    l.Tag?.replace("#","").toUpperCase().includes(input)
  );

  renderTabela(filtrados, `${sec}-tabela`, `${sec}-total`);
}

window.addEventListener("scroll", () => {
  document.getElementById("btnTopo").style.display =
    window.scrollY > 300 ? "block" : "none";
});

carregarTabela("Suprema", "suprema-tabela", "suprema-total");
carregarTabela("Diamante", "diamante-tabela", "diamante-total");
carregarTabela("Top100_API", "top100-tabela", "top100-total");

fetch(`https://opensheet.elk.sh/${SHEET_ID}/Info`)
  .then(r => r.json())
  .then(d => {
    document.getElementById("data-atualizacao").innerText =
      "Última atualização: " + (d[0]?.Atualizacao || "indisponível");
  });
</script>

</body>
</html>
