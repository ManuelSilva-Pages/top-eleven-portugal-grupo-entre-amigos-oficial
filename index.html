<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Top Eleven Portugal – Ranking Oficial</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f4f4f4;
    }

    header {
      background-color: #1f2933;
      color: white;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    header img { height: 80px; }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 5px 0 0;
      font-size: 14px;
      opacity: 0.9;
    }

    #data-atualizacao {
      font-size: 13px;
      opacity: 0.85;
      margin-top: 4px;
    }

    nav {
      background-color: #ffffff;
      padding: 10px;
      display: flex;
      gap: 10px;
      border-bottom: 1px solid #ddd;
    }

    nav button {
      padding: 10px 16px;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 14px;
      border-radius: 6px;
      transition: all 0.25s ease;
    }

    .btn-suprema { background-color: #1e3a8a; }
    .btn-diamante { background-color: #ec4899; }

    .btn-top100 {
  background: linear-gradient(135deg, #ae8625, #f7ef8a, #d2ac47, #edc967);
  color: #78350f;
      font-weight: bold;
    }

    nav button.active {
      box-shadow: 0 0 0 3px rgba(59,130,246,0.4);
      transform: scale(1.05);
    }

    section {
      display: none;
      padding: 20px;
      animation: fade 0.3s ease-in-out;
    }

    section.active { display: block; }

@keyframes fade {
  from {opacity:0; transform:translateY(5px);}
  to {opacity:1;}
}

.total-assoc {
  font-weight:bold;
  margin:10px 0;
  color:#374151;
}

input.pesquisa {
  padding:8px;
  width:100%;
  max-width:320px;
  margin-bottom:10px;
}

table {
  width:100%;
  border-collapse:collapse;
  background:white;
}

th, td {
  border:1px solid #ccc;
  padding:8px;
  text-align:center;
}

th { background:#e5e7eb; }

.top-1 { background:#ffd700; font-weight:bold; }
.top-2 { background:#c0c0c0; font-weight:bold; }
.top-3 { background:#cd7f32; font-weight:bold; }

.oficial-gea td {
  border-left:6px solid #16a34a;
  background:#ecfdf5;
}

.sem-resultados {
  background:#fff7d6;
  color:#92400e;
  font-weight:bold;
  text-align:center;
}

#topo {
  position: fixed;
  bottom: 20px;
  right: 20px;
  padding: 10px 16px;
  border: none;
  background: #111827;
  color: white;
  border-radius: 999px;
  cursor: pointer;
  display: none;
  font-size: 14px;
  font-weight: bold;
  display: flex;
  align-items: center;
  gap: 6px;
}
</style>
</head>

<body>

<header>
<img src="logo.png" alt="Top Eleven Portugal">
<div>
<h1>Top Eleven Portugal</h1>
<p>Ranking oficial do grupo Top Eleven Portugal – Grupo Entre Amigos [OFICIAL]</p>
<div id="data-atualizacao">Última atualização: a carregar...</div>
</div>
</header>

<nav>
<button class="btn-suprema active" onclick="mostrar('suprema',this)">Suprema</button>
<button class="btn-diamante" onclick="mostrar('diamante',this)">Diamante</button>
<button class="btn-top100" onclick="mostrar('top100',this)">Top 100</button>
</nav>

<section id="suprema" class="active">
<h2>Divisão Suprema</h2>
<input class="pesquisa" placeholder="🔍 Pesquisar associação ou tag..." oninput="filtrar('suprema')">
<div class="total-assoc" id="suprema-total"></div>
<div id="suprema-tabela"></div>
</section>

<section id="diamante">
<h2>Divisão Diamante</h2>
<input class="pesquisa" placeholder="🔍 Pesquisar associação ou tag..." oninput="filtrar('diamante')">
<div class="total-assoc" id="diamante-total"></div>
<div id="diamante-tabela"></div>
</section>

<section id="top100">
<h2>Top 100 Associações</h2>
<input class="pesquisa" placeholder="🔍 Pesquisar associação ou tag..." oninput="filtrar('top100')">
<div class="total-assoc" id="top100-total"></div>
<div id="top100-tabela"></div>
</section>

<button id="topo" onclick="window.scrollTo({top:0,behavior:'smooth'})">⬆ Topo</button>

<script>
const SHEET_ID = "1V0pgh17X-6oQnZyZ1Wo8YiQBCadTXw5DK8YIGjtxzBI";
const dadosGlobais = {};

function mostrar(id, btn) {
  document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function carregar(aba, secao, ordenarPorPontos) {
  fetch(`https://opensheet.elk.sh/${SHEET_ID}/${aba}`)
    .then(r => r.json())
    .then(dados => {

      // posição original do ficheiro
      dados.forEach((l, i) => l._posicaoReal = Number(l.Posicao) || i + 1);

      // ordenar se necessário
      if (ordenarPorPontos) {
        dados.sort((a, b) => b.Pontos - a.Pontos);
      }

      // posição FINAL do ranking (fixa)
      dados.forEach((l, i) => {
        l._posicaoRanking = ordenarPorPontos ? i + 1 : l._posicaoReal;
      });

      dadosGlobais[secao] = dados;
      render(secao, dados);
    });
}

function render(secao, dados) {
  document.getElementById(secao + "-total").innerText =
    `Total de associações nesta divisão: ${dados.length}`;

  let html = `<table>
    <tr>
      <th>Posição</th>
      <th>Associação</th>
      <th>Tag</th>
      <th>Pontos</th>
    </tr>`;

  if (!dados.length) {
    html += `
      <tr>
        <td colspan="4" class="sem-resultados">
          🔍 Nenhuma associação encontrada
        </td>
      </tr>
    </table>`;
    document.getElementById(secao + "-tabela").innerHTML = html;
    return;
  }

  dados.forEach(l => {
    let cls = "";
    if (l._posicaoRanking === 1) cls = "top-1";
    else if (l._posicaoRanking === 2) cls = "top-2";
    else if (l._posicaoRanking === 3) cls = "top-3";

    if (l.Associacao?.toUpperCase().startsWith("GEA")) {
      cls += " oficial-gea";
    }

    html += `
      <tr class="${cls}">
        <td>${l._posicaoRanking}</td>
        <td>${l.Associacao}</td>
        <td>${l.Tag || ""}</td>
        <td>${l.Pontos}</td>
      </tr>`;
  });

  html += "</table>";
  document.getElementById(secao + "-tabela").innerHTML = html;
}

function filtrar(secao) {
  let termo = document
    .querySelector(`#${secao} .pesquisa`)
    .value.toUpperCase()
    .replace("#", "");

  render(
    secao,
    dadosGlobais[secao].filter(l =>
      l.Associacao?.toUpperCase().includes(termo) ||
      l.Tag?.toUpperCase().replace("#", "").includes(termo)
    )
  );
}

function carregarData() {
  fetch(`https://opensheet.elk.sh/${SHEET_ID}/Info`)
    .then(r => r.json())
    .then(d => {
      if (d.length) {
        document.getElementById("data-atualizacao").innerText =
          "Última atualização: " + d[0].Atualizacao;
      }
    });
}

window.addEventListener("scroll", () => {
  document.getElementById("topo").style.display =
    window.scrollY > 200 ? "block" : "none";
});

carregar("Suprema", "suprema", true);
carregar("Diamante", "diamante", true);
carregar("Top100_API", "top100", false);
carregarData();
</script>

</body>
</html>
